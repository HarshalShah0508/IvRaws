services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ivraws
      POSTGRES_PASSWORD: ivraws
      POSTGRES_DB: ivraws
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ivraws"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # S3-compatible local storage. MinIO's Docker Hub images now require auth.
  # LocalStack's `latest` tag now requires a paid license too; pinned to 3.8,
  # the last community-edition release with free S3 emulation. Staging/prod use real S3.
  localstack:
    image: localstack/localstack:3.8
    restart: unless-stopped
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack

  # Local SMTP catcher — outgoing mail lands here instead of real inboxes.
  # Web UI at http://localhost:8025 to inspect sent emails during dev.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  redis_data:
  localstack_data:
