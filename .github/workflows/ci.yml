name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ivraws
          POSTGRES_PASSWORD: ivraws
          POSTGRES_DB: ivraws
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ivraws"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://ivraws:ivraws@localhost:5432/ivraws?schema=public
      NODE_ENV: test
      PORT: 3000
      JWT_ACCESS_SECRET: ci_access_secret_at_least_16_chars
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ci_refresh_secret_at_least_16_chars
      JWT_REFRESH_EXPIRES_IN: 30d
      CORS_ORIGINS: http://localhost:5173
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      S3_ENDPOINT: http://localhost:4566
      S3_REGION: us-east-1
      S3_BUCKET: ivraws-media
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      S3_FORCE_PATH_STYLE: "true"
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      RAZORPAY_KEY_ID: rzp_test_placeholder
      RAZORPAY_KEY_SECRET: razorpay_secret_placeholder
      RAZORPAY_WEBHOOK_SECRET: razorpay_webhook_secret_placeholder
      APP_BASE_URL: http://localhost:5173
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_FROM: "IvRaws <no-reply@ivraws.com>"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `npm ci` is skipped here because this npm version's resolver produces
      # a lockfile its own `npm ci` rejects as out-of-sync for this dependency
      # tree (same arborist issue noted in docker/Dockerfile).
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed catalog data
        run: npx tsx prisma/seed.ts

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
